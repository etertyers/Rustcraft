# The browser build (M71): getrandom 0.3 needs its backend chosen with a cfg
# flag; the feature alone is not enough.
[target.wasm32-unknown-unknown]
# SIMD (M73): every browser Rustcraft targets has it (Chrome 91, Safari 16.4, Firefox 89).
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"", "-C", "target-feature=+simd128"]
