[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
env_logger = "0.11.11"
glam = "0.34.1"
image = "0.25.10"
kira = "0.12.5"
log = "0.4.34"
lz4_flex = "0.14.0"
noise = "0.9.0"
pollster = "1.0.1"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30.13"

# Optimize dependencies in debug builds so `cargo run` stays playable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
