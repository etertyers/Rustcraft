[package]
name = "rustcraft"
version = "1.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
glam = { version = "0.34.1", features = ["serde"] }
image = "0.25.10"
kira = "0.12.5"
log = "0.4.34"
lz4_flex = "0.14.0"
noise = "0.9.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30.13"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Native only (M70): Lua mods, and low-priority threads for distant terrain (M69).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send", "serialize"] }
libc = "0.2.191"
env_logger = "0.11.11"
egui-winit = "0.37.0"
pollster = "1.0.1"

# The browser build (M70 on): see docs/web.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.37.0", default-features = false, features = ["links", "bytemuck"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Navigator",
    "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemWritableFileStream",
    "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "FileSystemRemoveOptions",
    "Response", "Request", "Blob", "File", "FileList", "Url", "Location", "UrlSearchParams",
    "AudioContext", "Performance", "Storage", "ReadableStream", "ResponseInit", "RequestInit",
    "DomRectReadOnly", "WorkerGlobalScope", "Worker", "WorkerOptions", "WorkerType", "MessageEvent",
] }
web-time = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Optimize dependencies in debug builds so `cargo run` stays playable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[build-dependencies]
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# The performance gate's benchmarks (`cargo bench`), from M14 on.
[dev-dependencies]
criterion = "0.8.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[[bench]]
name = "world"
harness = false
